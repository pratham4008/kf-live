# Fly.io config. Change `app` to a unique name, then: fly launch --copy-config --no-deploy
app = "kf-live-pratham"
primary_region = "ewr"            # Newark, close to the exchanges and to you

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "alpaca"
  DB_PATH = "/data/live.db"
  ALLOWED_ORIGINS = "https://pratham4008.github.io"

[mounts]
  source = "kf_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # the trading loop must keep running
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
